<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#1f5f52"
  >

  <title>2026 대만 가족여행</title>

  <link
    rel="apple-touch-icon"
    href="./icon-180.png"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="./styles.css"
  >


</head>


<body>


<header class="topbar">

  <div>

    <p class="eyebrow">
      TAIWAN FAMILY TRIP
    </p>

    <h1>
      2026 대만 가족여행
    </h1>

    <p class="sub">
      11월 3일부터 11월 9일까지 대만 가족여행
    </p>

  </div>

</header>



<main>


  <!-- =========================
       HOME
  ========================== -->

  <section
    id="home"
    class="view active"
  >


    <article class="hero card">

      <p class="eyebrow">
        TODAY
      </p>

      <h2 id="todayTitle">
        여행 전입니다
      </h2>

      <p id="todaySummary">
        대만으로 떠납니다 ✈️
      </p>

      <button
        class="primary"
        id="goTodayBtn"
      >
        오늘 일정 보기
      </button>

    </article>



    <div class="quick-grid">


      <button
        class="quick card"
        data-target="schedule"
      >

        🗓️

        <b>
          전체 일정
        </b>

        <small>
          DAY별로 보기
        </small>

      </button>



      <button
        class="quick card"
        data-target="prep"
      >

        🛍️

        <b>
          여행 준비
        </b>

        <small>
          준비물 · 쇼핑 · 현지 체크
        </small>

      </button>



      <button
        class="quick card"
        data-target="phrases"
      >

        💬

        <b>
          여행 회화
        </b>

        <small>
          중국어 바로 보기
        </small>

      </button>



    </div>



    <div class="section-head">

      <h3>
        여행 한눈에
      </h3>

    </div>



    <div
      id="overviewList"
      class="stack"
    ></div>


  </section>




  <!-- =========================
       SCHEDULE
  ========================== -->

  <section
    id="schedule"
    class="view"
  >


    <div class="section-head">

      <div>

        <p class="eyebrow">
          SCHEDULE
        </p>

        <h2>
          전체 일정
        </h2>

      </div>

    </div>



    <div
      id="dayTabs"
      class="day-tabs"
    ></div>



    <div
      id="dayDetail"
    ></div>


  </section>




  <!-- =========================
       GUIDE
  ========================== -->

  <section
    id="guide"
    class="view"
  >


    <div class="section-head">

      <div>

        <p class="eyebrow">
          GUIDE
        </p>

        <h2>
          장소 가이드
        </h2>

      </div>

    </div>



    <div
      id="guideList"
      class="stack"
    ></div>


  </section>




  <!-- =========================
       PHRASES
  ========================== -->

  <section
    id="phrases"
    class="view"
  >


    <div class="section-head">

      <div>

        <p class="eyebrow">
          PHRASES
        </p>

        <h2>
          대만 기본 회화
        </h2>

      </div>

    </div>



    <div
      id="phraseList"
      class="stack"
    ></div>


  </section>




  <!-- =========================
       INFO
  ========================== -->

  <section
    id="info"
    class="view"
  >


    <div class="section-head">

      <div>

        <p class="eyebrow">
          INFO
        </p>

        <h2>
          여행 정보
        </h2>

      </div>

    </div>



    <div class="stack">


      <!-- 타이베이 숙소 -->

      <article class="card info-card">

        <h3>
          타이베이 숙소
        </h3>

        <p>
          No. 13, Section 1, Kaifeng Street, Taipei City 100
        </p>



      </article>




      <!-- 가오슝 숙소 -->

      <article class="card info-card">

        <h3>
          가오슝 숙소
        </h3>

        <p>
          No. 151, Zhongshan 1st Road, Kaohsiung City 800
        </p>



      </article>


    </div>


  </section>


</main>




<!-- =========================
     BOTTOM NAV
========================== -->

<nav class="bottom-nav">


  <button
    data-target="home"
    class="active"
  >

    ⌂

    <span>
      홈
    </span>

  </button>



  <button
    data-target="schedule"
  >

    ▦

    <span>
      일정
    </span>

  </button>



  <button
    data-target="guide"
  >

    ⌖

    <span>
      장소 가이드
    </span>

  </button>



  <button
    data-target="info"
  >

    ☰

    <span>
      정보
    </span>

  </button>


</nav>




<script src="./config.js?v=public-cleanup-20261111"></script>

<script src="./data.js"></script>

<script src="./app.js?v=public-cleanup-20261111"></script>


</body>

</html>
