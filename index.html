<!-- INFO -->
<section id="info" class="view">

  <div class="section-head">
    <div>
      <p class="eyebrow">INFO</p>
      <h2>여행 정보</h2>
    </div>
  </div>

  <div class="stack">

    <article class="card info-card">
      <h3>타이베이 숙소</h3>

      <p>
        No. 13, Section 1, Kaifeng Street, Taipei City 100
      </p>

      <div class="map-wrap">
        <iframe
          src="https://www.google.com/maps?q=No.+13,+Section+1,+Kaifeng+Street,+Taipei+City+100&output=embed"
          loading="lazy"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </article>

    <article class="card info-card">
      <h3>가오슝 숙소</h3>

      <p>
        No. 151, Zhongshan 1st Road, Kaohsiung City 800
      </p>

      <div class="map-wrap">
        <iframe
          src="https://www.google.com/maps?q=No.+151,+Zhongshan+1st+Road,+Kaohsiung+City+800&output=embed"
          loading="lazy"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </article>

  </div>

</section>
.map-wrap {
  margin-top: 16px;
  overflow: hidden;
  border-radius: 18px;
}

.map-wrap iframe {
  display: block;
  width: 100%;
  height: 240px;
  border: 0;
}
